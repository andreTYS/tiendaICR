# Development compose — PostgreSQL only.
# Next.js runs on the host (npm run dev) for fast HMR.
# Usage: docker compose -f docker-compose.dev.yml up -d

name: inversiones-icr-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: icr
      POSTGRES_USER: icr
      POSTGRES_PASSWORD: icr
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icr -d icr"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata-dev:
