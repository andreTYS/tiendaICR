# --- BLOQUE 1: REDIRECCIÓN GLOBAL A HTTPS ---
server {
    listen 80 default_server;
    server_name _;
    location ~ /.well-known/acme-challenge/ { allow all; root /var/www/html; }

    location / { return 301 https://$host$request_uri; }
}

# --- BLOQUE 2: LANDING (AHORA CON SSL) ---
server {
    listen 443 ssl;
    server_name inversionesicr.com www.inversionesicr.com;

    ssl_certificate /etc/letsencrypt/live/inversionesicr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inversionesicr.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
	proxy_redirect off;
    }
}

#--- BLOQUE 3: APP ERP (SSL) ---
server {
    listen 443 ssl;
    server_name app.inversionesicr.com;
    ssl_certificate /etc/letsencrypt/live/app.inversionesicr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.inversionesicr.com/privkey.pem;
    client_max_body_size 50M; 

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

